<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Benchmark'it — LLM benchmark</title>
    <script>
      // Resolve the Pico theme before first paint: saved choice wins,
      // otherwise follow the OS preference (and keep following it).
      ;(function () {
        var KEY = 'benchmarkit:theme'
        var stored = null
        try { stored = window.localStorage.getItem(KEY) } catch (e) {}
        var mq = window.matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var dark = stored ? stored === 'dark' : mq.matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        }
        apply()
        mq.addEventListener('change', function () { if (!stored) apply() })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
