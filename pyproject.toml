[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchmarkit"
version = "0.1.0"
description = "Benchmark LLM endpoints with streaming responses and LLM-based verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "litellm",
    "pydantic>=2",
    "python-dotenv",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "httpx",
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[project.scripts]
benchmarkit = "src.api.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]
